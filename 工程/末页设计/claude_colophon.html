<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版本记 · 《埃涅阿斯纪》</title>
<!--
  使用说明
  1. 用户确认：Novelist；第四版；2026.10.9；豆瓣252994365。
     字体说明已按本次PDF填写；DOI已据用户提供的Zenodo预留编号填写；登记状态以平台正式发布为准。
  2. 普通字段删空时整项隐藏；DOI字段为空时仍保留标签与两行编号空间。
     注意：标签 <dd>…</dd> / <p>…</p> 之间不能留空格或换行，否则不算"空"。
     豆瓣链接与二维码已内置；若修改主页，必须同步重新生成二维码。
  3. 打印 / 导出 PDF：纸张 185 × 260 mm（或自定义尺寸），边距"无"，缩放 100%，
     勾选"背景图形"。
-->
<style>
  /* ---------- 基本量 ---------- */
  :root{
    --ink:  #43545A;               /* 主色 深灰蓝 */
    --gray: #5F6B70;               /* 小字灰，白底对比度约 5.5:1 */

    /* 基线单位：整页 260 mm 恰好分成 58 行，1u ≈ 4.483 mm ≈ 12.7 pt */
    --u: calc(260mm / 58);
    --m: calc(var(--u) * 3);       /* 四边页边距相等 ≈ 13.4 mm */

    /* 字面微调：大字的字面（墨迹）比字身框小，用它把墨迹边缘对到网格上。
       换字体后若上下左右差零点几毫米，只改这两个值 */
    --bearing: calc(var(--u) * .8);   /* 大字：字身框到字面的留白 */
    --cap:     calc(var(--u) * .27);  /* 小字：行框顶到字面顶的距离 */

    --cjk:  "Source Han Sans SC","Noto Sans CJK SC","Noto Sans SC","PingFang SC",
            "HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
    --sans: "Helvetica Neue",Helvetica,Arial,
            "Source Han Sans SC","Noto Sans CJK SC","Noto Sans SC","PingFang SC",
            "HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  }

  *{ box-sizing:border-box }
  html{ -webkit-print-color-adjust:exact; print-color-adjust:exact }
  body{ margin:0; background:#fff; color:var(--ink); font-family:var(--sans) }
  h1,dl,dt,dd,p,figure,figcaption{ margin:0; font-weight:inherit }

  /* ---------- 页面：12 栏 × 58 行 ---------- */
  .page{
    position:relative;
    width:185mm; height:260mm; overflow:hidden;
    padding-inline:var(--m);
    display:grid;
    grid-template-columns:repeat(12, minmax(0,1fr));
    grid-template-rows:repeat(58, var(--u));
    column-gap:var(--u);
    background:#fff;
    break-inside:avoid; break-after:avoid;
  }

  /* ---------- 大字：版本记（竖排，占 1–5 栏、第 4–51 行） ---------- */
  .title{
    grid-area:4 / 1 / 52 / 7;
    justify-self:start; align-self:start;
    width:calc(var(--u) * 16);
    height:calc(var(--u) * 48);
    margin:calc(var(--bearing) * -1) 0 0 calc(var(--bearing) * -1);
    writing-mode:vertical-rl;
    white-space:nowrap;
    font-family:var(--cjk);
    font-weight:900;
    font-size:calc(var(--u) * 16);     /* ≈ 71.7 mm ≈ 203 pt */
    line-height:1;
    letter-spacing:0;
    color:var(--ink);
  }

  /* ---------- 右栏（第 8–12 栏）：同一条轴线，版本／署名日期／辅助信息三个层级 ---------- */
  .f{ grid-column:8 / 13 }

  .f dt{
    font-size:9pt; line-height:var(--u);
    font-weight:500; letter-spacing:.04em;
    color:var(--gray);
  }
  .f dd{ font-weight:500; color:var(--ink); overflow-wrap:anywhere }

  /* 制作与发布：字面顶 对齐「版」的字面顶 */
  .by{ grid-row:4 / 9;  align-self:start }
  .by dd{ font-size:14pt; line-height:calc(var(--u) * 2) }
  .by .account-id{
    font-size:9pt; line-height:var(--u); font-weight:400;
    color:var(--gray); white-space:nowrap;
  }

  /* 版本：字面顶 对齐「本」的字面顶；全页最大的小字 */
  .ver{ grid-row:20 / 24; align-self:start }
  .ver dd{ font-size:24pt; line-height:calc(var(--u) * 2); font-weight:700; transform:translateX(-0.25mm) }

  .by dt, .ver dt{ position:relative; top:calc(var(--cap) * -1) }

  /* 发布日期：右栏下半部，为下方主页入口保留完整空间 */
  .date{ grid-row:26 / 30; align-self:start }
  .date dd{ font-size:14pt; line-height:calc(var(--u) * 2) }

  /* 字段为空 → 整项隐藏 */
  .f:not(.doi):has(dd:empty){ display:none }

  /* DOI：日期下方、二维码上方；留出两行，真实编号取得后再填。 */
  .doi{ grid-row:32 / 36; align-self:start }
  .doi dd{ min-height:calc(var(--u) * 2); font-size:9pt;
    line-height:var(--u); font-weight:400; color:var(--gray);
    overflow-wrap:anywhere }
  .doi dd a{ color:inherit; font:inherit; text-decoration:none }

  /* ---------- 主页二维码：右栏下部，与日期、勘误构成发布信息区 ---------- */
  .qr{
    grid-column:8 / 13; grid-row:41 / 52;
    align-self:start; justify-self:start;
    display:flex; flex-direction:column; gap:2mm;
    width:35mm;
  }
  .qr-link{
    display:block; width:35mm; height:35mm;
    /* 对齐图案墨迹；四模块白色静区完整保留在栏间留白中。 */
    margin-inline-start:calc(-35mm * 4 / 37);
  }
  .qr svg{ display:block; width:35mm; height:35mm }
  .qr-caption{
    font-family:inherit; font-size:9pt; font-weight:400;
    line-height:var(--u); color:var(--gray); white-space:nowrap;
  }
  .qr-caption a, .qr-erratum{ display:block }
  .qr-erratum{ font:inherit; color:inherit }
  .qr-caption a{
    color:inherit; font:inherit; text-decoration:none;
  }

  /* ---------- 右下：可选小字，贴底边向上排 ---------- */
  .notes{
    grid-column:8 / 13; grid-row:53 / 56; align-self:end;
    font-size:9pt; line-height:var(--u);
    color:var(--gray);
  }
  .notes p:empty,
  .notes p:has(> a:empty){ display:none }
  .notes a{
    color:var(--ink); font-weight:700;
    text-decoration:underline;
    text-decoration-thickness:.06em;
    text-underline-offset:.22em;
    overflow-wrap:anywhere;
  }

  /* ---------- 左下：与右下最后一行共用同一条基线 ---------- */
  .tag{
    grid-area:55 / 1 / 56 / 6; align-self:end;
    font-size:9pt; line-height:var(--u);
    font-weight:500; letter-spacing:.02em;
    color:var(--ink);
  }

  /* ---------- 打印：实际尺寸、单页 ---------- */
  @page{ size:185mm 260mm; margin:0 }
  @media print{
    html,body{
      width:185mm; height:260mm; margin:0; padding:0;
      overflow:hidden; background:#fff;
    }
  }

  /* ---------- 屏幕预览（不影响打印） ---------- */
  @media screen{
    html{ background:#e6eaec }
    body{ display:flex; justify-content:center; padding:20px 10px 32px }
    .page{ box-shadow:0 1px 2px rgba(0,0,0,.1), 0 10px 32px rgba(0,0,0,.14) }
  }
  @media screen and (max-width:740px){ .page{ zoom:.88 } }
  @media screen and (max-width:640px){ .page{ zoom:.72 } }
  @media screen and (max-width:540px){ .page{ zoom:.60 } }
  @media screen and (max-width:460px){ .page{ zoom:.50 } }
  @media screen and (max-width:380px){ .page{ zoom:.46 } }
</style>
